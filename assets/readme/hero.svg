<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MediTrack — Intelligent Medicine &amp; Dosage Companion for Bangladesh</title>
  <desc id="hero-desc">Android medicine management app with Gemini 3.6 prescription OCR, offline Bangladesh medicine catalog, dose alarms, and context-aware AI assistant.</desc>

  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="60%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0e1626"/>
    </linearGradient>

    <!-- Brand blue glow -->
    <radialGradient id="glow-blue" cx="15%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#5B8FF5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5B8FF5" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent glow -->
    <radialGradient id="glow-accent" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#F45BA5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F45BA5" stop-opacity="0"/>
    </radialGradient>

    <!-- Card glass gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#121a2a"/>
    </linearGradient>

    <!-- Dose item gradient -->
    <linearGradient id="item-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2c45"/>
      <stop offset="100%" stop-color="#182338"/>
    </linearGradient>

    <!-- Button gradient -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="420" rx="24" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow-blue)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow-accent)"/>
  <rect width="1200" height="420" rx="24" fill="none" stroke="#25354e" stroke-width="1.5"/>

  <!-- Subtle grid pattern lines -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <line x1="56" y1="100" x2="1144" y2="100" stroke-dasharray="4 8"/>
    <line x1="56" y1="210" x2="1144" y2="210" stroke-dasharray="4 8"/>
    <line x1="56" y1="320" x2="1144" y2="320" stroke-dasharray="4 8"/>
    <line x1="380" y1="40" x2="380" y2="380" stroke-dasharray="4 8"/>
    <line x1="680" y1="40" x2="680" y2="380" stroke-dasharray="4 8"/>
  </g>

  <!-- LEFT COLUMN: Identity & Product Value (x: 56) -->
  <g id="identity-block" transform="translate(56, 44)">
    <!-- Eyebrow Pill -->
    <g transform="translate(0, 0)">
      <rect width="280" height="28" rx="14" fill="#1e2d47" stroke="#334769" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#10B981"/>
      <text x="27" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SMART MEDICINE COMPANION</text>
      <text x="238" y="19" fill="#5B8FF5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">BD</text>
    </g>

    <!-- Main Title with Cross Motif -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">MediTrack</text>
      <!-- Red/Pink medical cross accent dot -->
      <g transform="translate(242, -38)">
        <circle cx="16" cy="16" r="16" fill="#F45BA5" fill-opacity="0.15"/>
        <path d="M16 8 V24 M8 16 H24" stroke="#F45BA5" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Plain-Language Value Proposition -->
    <g transform="translate(0, 102)">
      <text x="0" y="0" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
        AI prescription OCR, local dose reminders, and
      </text>
      <text x="0" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
        Bangladesh generic drug price discovery in one app.
      </text>
    </g>

    <!-- Key Feature Badges Grid -->
    <g transform="translate(0, 172)">
      <!-- Feature 1: Gemini OCR -->
      <g transform="translate(0, 0)">
        <rect width="176" height="34" rx="8" fill="#162238" stroke="#253754" stroke-width="1"/>
        <text x="12" y="22" fill="#5B8FF5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⚡ Gemini 3.6 OCR</text>
      </g>

      <!-- Feature 2: Offline SQLite -->
      <g transform="translate(186, 0)">
        <rect width="186" height="34" rx="8" fill="#162238" stroke="#253754" stroke-width="1"/>
        <text x="12" y="22" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">💊 BD Medicine DB</text>
      </g>

      <!-- Feature 3: Local Alarms -->
      <g transform="translate(382, 0)">
        <rect width="180" height="34" rx="8" fill="#162238" stroke="#253754" stroke-width="1"/>
        <text x="12" y="22" fill="#FFB45F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⏰ Exact Dose Alarms</text>
      </g>

      <!-- Feature 4: OpenRouter AI -->
      <g transform="translate(0, 44)">
        <rect width="176" height="34" rx="8" fill="#162238" stroke="#253754" stroke-width="1"/>
        <text x="12" y="22" fill="#F45BA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🤖 AI Assistant</text>
      </g>

      <!-- Feature 5: BD Carrier Billing -->
      <g transform="translate(186, 44)">
        <rect width="186" height="34" rx="8" fill="#162238" stroke="#253754" stroke-width="1"/>
        <text x="12" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">৳ Carrier Billing</text>
      </g>

      <!-- Feature 6: Bangla & English -->
      <g transform="translate(382, 44)">
        <rect width="180" height="34" rx="8" fill="#162238" stroke="#253754" stroke-width="1"/>
        <text x="12" y="22" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🌐 English &amp; বাংলা</text>
      </g>
    </g>

    <!-- Stack Metadata Row -->
    <g transform="translate(0, 290)">
      <text x="0" y="16" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500">
        FLUTTER 3.44+ · FIREBASE · GEMINI FLASH · ML KIT · OFFLINE SQLITE
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Project-Native Visual Proof Card (x: 670, y: 36) -->
  <g id="live-preview-card" transform="translate(670, 36)">
    <!-- Phone / Dashboard Floating Window -->
    <rect width="474" height="348" rx="20" fill="url(#card-grad)" stroke="#2b3b55" stroke-width="1.5"/>

    <!-- Window Header -->
    <g transform="translate(24, 20)">
      <!-- Mini device dots -->
      <circle cx="6" cy="6" r="4" fill="#EF4444" opacity="0.8"/>
      <circle cx="20" cy="6" r="4" fill="#F59E0B" opacity="0.8"/>
      <circle cx="34" cy="6" r="4" fill="#10B981" opacity="0.8"/>

      <!-- Header title -->
      <text x="54" y="11" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Today's Schedule</text>
      
      <!-- Date & Adherence pill -->
      <rect x="290" y="-3" width="136" height="24" rx="12" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="302" cy="9" r="4" fill="#10B981"/>
      <text x="312" y="14" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">2 of 3 Completed</text>
    </g>

    <!-- Dose Item 1: Active Napa Extra -->
    <g transform="translate(20, 58)">
      <rect width="434" height="84" rx="14" fill="url(#item-grad)" stroke="#2f4160" stroke-width="1"/>
      
      <!-- Icon pill container -->
      <rect x="14" y="16" width="52" height="52" rx="12" fill="#5B8FF5" fill-opacity="0.15"/>
      <!-- Pill drawing -->
      <g transform="translate(28, 30)">
        <rect x="0" y="0" width="24" height="12" rx="6" transform="rotate(-45 12 6)" fill="#5B8FF5"/>
        <rect x="0" y="0" width="12" height="12" rx="0" transform="rotate(-45 12 6)" fill="#FFFFFF" opacity="0.3"/>
      </g>

      <!-- Drug details -->
      <text x="80" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Napa Extra 500mg</text>
      <text x="80" y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Paracetamol + Caffeine · After Meal</text>
      <text x="80" y="68" fill="#5B8FF5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⏰ Morning 8:00 AM · Due Now</text>

      <!-- Take Button -->
      <rect x="330" y="24" width="90" height="36" rx="10" fill="url(#btn-grad)"/>
      <text x="350" y="47" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">✓ Take</text>
    </g>

    <!-- Dose Item 2: Sergel 20mg + Price Comparison -->
    <g transform="translate(20, 152)">
      <rect width="434" height="84" rx="14" fill="url(#item-grad)" stroke="#2f4160" stroke-width="1"/>
      
      <!-- Icon capsule container -->
      <rect x="14" y="16" width="52" height="52" rx="12" fill="#F45BA5" fill-opacity="0.15"/>
      <!-- Capsule drawing -->
      <g transform="translate(30, 28)">
        <rect x="0" y="0" width="10" height="24" rx="5" transform="rotate(30 5 12)" fill="#F45BA5"/>
        <rect x="0" y="12" width="10" height="12" rx="0" transform="rotate(30 5 12)" fill="#FFFFFF" opacity="0.35"/>
      </g>

      <!-- Drug details -->
      <text x="80" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Sergel 20mg</text>
      <text x="80" y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Esomeprazole · Night 10:00 PM</text>
      
      <!-- Refill & Cheaper Alternative tag -->
      <g transform="translate(80, 58)">
        <rect width="210" height="18" rx="4" fill="#FEF3C7" fill-opacity="0.12"/>
        <text x="6" y="13" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💡 Cheaper generic: Maxpro (৳7 vs ৳8)</text>
      </g>

      <!-- Stock pill -->
      <rect x="330" y="28" width="90" height="28" rx="8" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="342" y="46" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚠️ 4 left</text>
    </g>

    <!-- Mini Bottom Card: AI Assistant Insight Card -->
    <g transform="translate(20, 246)">
      <rect width="434" height="82" rx="14" fill="#131d2e" stroke="#3b537a" stroke-width="1"/>
      
      <g transform="translate(14, 14)">
        <circle cx="16" cy="16" r="16" fill="#5B8FF5" fill-opacity="0.2"/>
        <text x="9" y="22" fill="#5B8FF5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">🤖</text>
        
        <text x="42" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">MediTrack AI Assistant</text>
        <rect x="200" y="4" width="70" height="18" rx="9" fill="#5B8FF5" fill-opacity="0.2"/>
        <text x="210" y="16" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CONFIRMED</text>

        <text x="42" y="38" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400">
          "Logged 1 dose Napa Extra. Stock updated to 18 tabs."
        </text>
        <text x="42" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
          Restock reminder scheduled for Monday morning.
        </text>
      </g>
    </g>
  </g>
</svg>
