<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="sec-showcase-title sec-showcase-desc">
  <title id="sec-showcase-title">App Experience &amp; Feature Showcase</title>
  <desc id="sec-showcase-desc">Interface gallery showing routine dashboard, dosage schedule, Gemini AI chat, and medicine price lookups.</desc>

  <defs>
    <linearGradient id="showcase-banner-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="60%" stop-color="#141f35"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <radialGradient id="showcase-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F45BA5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F45BA5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="130" rx="18" fill="url(#showcase-banner-bg)"/>
  <rect width="1200" height="130" rx="18" fill="url(#showcase-glow)"/>
  <rect width="1200" height="130" rx="18" fill="none" stroke="#22334d" stroke-width="1.2"/>

  <!-- Left Accent Bar & Cross -->
  <g transform="translate(48, 28)">
    <rect width="4" height="74" rx="2" fill="#F45BA5"/>
    
    <g transform="translate(24, 6)">
      <!-- Eyebrow -->
      <g transform="translate(0, 0)">
        <circle cx="5" cy="5" r="4" fill="#F45BA5"/>
        <text x="16" y="9" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">VISUAL PROOF &amp; INTERFACE</text>
      </g>
      <!-- Title -->
      <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">App Experience &amp; Showcase</text>
    </g>
  </g>

  <!-- Right Side Tag / Pill -->
  <g transform="translate(770, 44)">
    <rect width="382" height="42" rx="21" fill="#18253d" stroke="#2d4268" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#10B981"/>
    <text x="38" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">13 Live Screens · Light &amp; Dark Theme · Bangla/EN</text>
  </g>
</svg>
