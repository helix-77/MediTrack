<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="sec-features-title sec-features-desc">
  <title id="sec-features-title">Key Features &amp; Daily Routine</title>
  <desc id="sec-features-desc">Core capabilities including dose alarms, stock management, AI prescription scanning, and price discovery.</desc>

  <defs>
    <linearGradient id="features-banner-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="60%" stop-color="#141f35"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <radialGradient id="features-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B8FF5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5B8FF5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="130" rx="18" fill="url(#features-banner-bg)"/>
  <rect width="1200" height="130" rx="18" fill="url(#features-glow)"/>
  <rect width="1200" height="130" rx="18" fill="none" stroke="#22334d" stroke-width="1.2"/>

  <!-- Left Accent Bar & Title -->
  <g transform="translate(48, 28)">
    <rect width="4" height="74" rx="2" fill="#5B8FF5"/>
    
    <g transform="translate(24, 6)">
      <!-- Eyebrow -->
      <g transform="translate(0, 0)">
        <circle cx="5" cy="5" r="4" fill="#5B8FF5"/>
        <text x="16" y="9" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CAPABILITIES &amp; WORKFLOW</text>
      </g>
      <!-- Title -->
      <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Key Features &amp; Daily Routine</text>
    </g>
  </g>

  <!-- Right Side Tag / Pill -->
  <g transform="translate(790, 44)">
    <rect width="362" height="42" rx="21" fill="#18253d" stroke="#2d4268" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#5B8FF5"/>
    <text x="38" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Alarms · Gemini OCR · BD Catalog · Subscriptions</text>
  </g>
</svg>
